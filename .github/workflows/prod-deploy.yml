name: PROD CD

on:
  workflow_dispatch:
  push:
    branches: [ main ]

env:
  IMAGE_NAME: atcha
  VERSION: ${{ github.sha }}

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true
          token: ${{ secrets.SUBMODULE_TOKEN }}

      - name: Debug - List submodule folder contents
        run: |
          echo "=== Submodule (16th-team6-BE-submodule) Contents ==="
          ls -Rla ./16th-team6-BE-submodule

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build Docker Image
        run: docker build -t ${{ secrets.DOCKER_HUB_USERNAME }}/atcha_prod:latest .

      - name: Push Docker Image
        run: docker push ${{ secrets.DOCKER_HUB_USERNAME }}/atcha_prod:latest

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copy file via ssh password
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.PROD_APP_IP }}
          username: ${{ secrets.PROD_USERNAME }}
          key: ${{ secrets.PROD_SSH_KEY }}
          port: ${{ secrets.REMOTE_SSH_PORT }}

          timeout: 120s
          source: "./deployment/prod/"
          target: /home/atcha/

      - name: SSH to Prod Server and Deploy
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.PROD_APP_IP }}
          username: ${{ secrets.PROD_USERNAME }}
          key: ${{ secrets.PROD_SSH_KEY }}
          port: ${{ secrets.REMOTE_SSH_PORT }}

          script: |
            cd /home/atcha
            # data 디렉터리에는 TLS 인증서(data/certbot)가 들어 있으므로 통째로 지우지 않는다.
            # nginx.conf(현재 활성 색)는 서버 상태이므로 건드리지 않고 deploy.sh 가 교체한다.
            cp -f /home/atcha/deployment/prod/deploy.sh /home/atcha/deploy.sh
            cp -f /home/atcha/deployment/prod/docker-compose.yml /home/atcha/docker-compose.yml
            sudo cp -f /home/atcha/deployment/prod/data/nginx/nginx-blue.conf /home/atcha/data/nginx/nginx-blue.conf
            sudo cp -f /home/atcha/deployment/prod/data/nginx/nginx-green.conf /home/atcha/data/nginx/nginx-green.conf
            rm -rf /home/atcha/deployment
            sudo bash ./deploy.sh
