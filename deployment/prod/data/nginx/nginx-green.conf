upstream atcha-green {
    server atcha-green:8080;
}

upstream atcha-green-actuator {
    server atcha-green:5959;
}

server {
    listen 80 default_server;
    server_name atcha.online atcha.kro.kr;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    server_name atcha.online;

    ssl_certificate /etc/letsencrypt/live/atcha.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/atcha.online/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    error_log /dev/stderr warn;
    access_log /dev/stdout;

    location /api/ {
        proxy_pass http://atcha-green;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $http_host;
        proxy_set_header Connection '';
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    location /act-atcha/ {
        proxy_pass http://atcha-green-actuator;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $http_host;
        proxy_set_header Connection '';
        proxy_http_version 1.1;
    }
}

server {
    listen 443 ssl;
    server_name atcha.kro.kr;

    ssl_certificate /etc/letsencrypt/live/atcha.kro.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/atcha.kro.kr/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    error_log /dev/stderr warn;
    access_log /dev/stdout;

    location /api/ {
        proxy_pass http://atcha-green;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $http_host;
        proxy_set_header Connection '';
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    location /act-atcha/ {
        proxy_pass http://atcha-green-actuator;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $http_host;
        proxy_set_header Connection '';
        proxy_http_version 1.1;
    }
}
